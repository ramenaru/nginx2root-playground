# Hardened nginx configuration used by the test suite.
user www-data;
worker_processes auto;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name secure.example;
        ssl_certificate /etc/nginx/certs/secure.crt;
        ssl_certificate_key /etc/nginx/certs/secure.key;
        root /var/www/secure;

        location / { try_files $uri $uri/ =404; }
        location /files/ { alias /var/www/files/; }
        location /status { stub_status; allow 127.0.0.1; deny all; }
        location ~ /\.(?!well-known) { deny all; }
        limit_req zone=one burst=20 nodelay;
    }
}
