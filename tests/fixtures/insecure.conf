# Deliberately insecure nginx configuration used by the test suite.
user root;
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens on;
    merge_slashes off;
    client_max_body_size 0;
    access_log off;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'RC4-SHA:DES-CBC3-SHA:HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers off;

    server {
        listen 80;
        server_name insecure.example;
        root /var/www/html;
        location / { index index.html; }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name insecure.example www.insecure.example;
        ssl_certificate /etc/nginx/certs/insecure.crt;
        ssl_certificate_key /etc/nginx/certs/insecure.key;
        root /;
        autoindex on;
        add_header X-Frame-Options DENY;

        location /files {
            alias /var/www/files/;
            autoindex on;
        }

        location /status {
            stub_status;
        }

        location /dav {
            dav_methods PUT DELETE;
            alias /var/www/dav/;
        }

        location /proxy {
            proxy_pass http://$http_host;
        }
    }
}
