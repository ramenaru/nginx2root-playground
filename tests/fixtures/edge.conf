# Edge cases: risky include, sensitive root, dynamic proxy, DAV, OCSP.
user www-data;
events { worker_connections 128; }

http {
    server_tokens off;
    underscores_in_headers on;
    ignore_invalid_headers off;

    server {
        listen 443 ssl;
        http2 on;
        server_name edge.example;
        ssl_certificate /nonexistent/edge.crt;
        ssl_certificate_key /nonexistent/edge.key;
        ssl_stapling on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'HIGH:!aNULL:!MD5';
        add_header Strict-Transport-Security "max-age=60" always;

        root /etc;
        include /tmp/extra.conf;

        location / { proxy_pass http://$arg_backend; }
        location /if { if ($arg_x) { proxy_pass http://backend; } }
        location /dav { dav_methods PUT; }
    }
}
