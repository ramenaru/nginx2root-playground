user root;
worker_processes 1;
pid /tmp/nginx.pid;
env LAB_TOKEN;

events {
    worker_connections 256;
}

http {
    server_tokens on;
    autoindex on;
    merge_slashes off;
    underscores_in_headers on;
    ignore_invalid_headers off;
    client_max_body_size 0;
    client_header_timeout 600s;
    client_body_timeout 600s;
    send_timeout 600s;
    large_client_header_buffers 4 64k;
    keepalive_requests 10000;
    http2_max_concurrent_streams 256;
    access_log off;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'RC4-SHA:DES-CBC3-SHA:AES128-SHA:@SECLEVEL=0';
    ssl_prefer_server_ciphers off;
    ssl_session_cache off;
    ssl_verify_client optional_no_ca;

    include /tmp/lab-extra.conf;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name localhost;
        ssl_certificate /etc/nginx/certs/lab.crt;
        ssl_certificate_key /etc/nginx/certs/lab.key;
        root /var/www/lab;
        index index.html;

        http2_push /style.css;

        location / {
            try_files $uri $uri/ =404;
        }

        location /files {
            alias /var/www/lab/files/;
        }

        location /dav/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
        }

        location /status {
            stub_status;
        }

        location /private/ {
            auth_basic "lab";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        location /proxy/ {
            proxy_pass http://$http_host;
        }

        location /if/ {
            if ($arg_go) {
                proxy_pass http://127.0.0.1:9000;
            }
        }

        location /old/ {
            return 301 http://example.com$request_uri;
        }

        location /system/ {
            alias /etc/;
        }
    }

    server {
        listen 8080 http2;
        server_name localhost;
        root /var/www/lab;

        location / {
            return 200 "h2c lab\n";
        }
    }
}
