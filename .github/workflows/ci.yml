name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S warning n2rpg.sh install.sh tests/run.sh tests/integration.sh lab/run.sh lab/stop.sh lab/audit.sh lab/entrypoint.sh

  test:
    name: fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run tests
        run: bash tests/run.sh

  integration:
    name: real nginx integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run integration test
        run: bash tests/integration.sh

  lab:
    name: lab smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start lab
        run: bash lab/run.sh
      - name: Audit both targets
        run: bash lab/audit.sh
      - name: Check results
        run: |
          jq -e '.summary.critical == 0 and .summary.high == 0' lab/results/hardened.json
          jq -e '.summary.critical > 0' lab/results/vulnerable.json
