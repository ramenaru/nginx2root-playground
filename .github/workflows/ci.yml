name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S warning n2rpg.sh install.sh tests/run.sh tests/integration.sh lab/run.sh lab/stop.sh lab/audit.sh lab/entrypoint.sh

  test:
    name: fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run tests
        run: bash tests/run.sh

  action:
    name: action wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Audit secure fixture
        id: secure
        uses: ./
        with:
          dump: tests/fixtures/secure.conf
          nginx-version: "1.31.9"
          no-live: "true"
          fail-on: high
      - name: Check passing action
        run: test "${{ steps.secure.outputs.exit-code }}" = "0"
      - name: Audit insecure fixture
        id: insecure
        continue-on-error: true
        uses: ./
        with:
          dump: tests/fixtures/insecure.conf
          nginx-version: "1.25.2"
          no-live: "true"
          fail-on: high
      - name: Check failing action
        run: test "${{ steps.insecure.outputs.exit-code }}" = "1"
      - name: Write sarif report
        id: sarif
        uses: ./
        with:
          dump: tests/fixtures/insecure.conf
          nginx-version: "1.25.2"
          no-live: "true"
          fail-on: none
          format: sarif
          output: n2rpg.sarif
      - name: Check sarif report
        run: jq -e '.version == "2.1.0" and (.runs[0].results | length > 0)' n2rpg.sarif

  integration:
    name: real nginx integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run integration test
        run: bash tests/integration.sh

  lab:
    name: lab smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and start lab
        run: bash lab/run.sh
      - name: Audit both targets
        run: bash lab/audit.sh
      - name: Check results
        run: |
          jq -e '.summary.critical == 0 and .summary.high == 0' lab/results/hardened.json
          jq -e '.summary.critical > 0' lab/results/vulnerable.json
